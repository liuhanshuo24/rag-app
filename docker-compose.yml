services:
  rag-app:
    build: .
    container_name: rag-app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # 首次构建索引需联网下载模型，国内网络走镜像
      - HF_ENDPOINT=https://hf-mirror.com
    volumes:
      # 模型缓存持久化（避免每次启动重新下载约 2.4GB）
      - hf-cache:/app/.hf_cache
      # 知识库与向量库持久化
      - ./data:/app/data
      - ./chroma_db:/app/chroma_db
    restart: unless-stopped

volumes:
  hf-cache:
